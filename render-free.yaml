# Optional Blueprint path. This is the Free plan, with no disk.
services:
  - type: web
    name: clinicavisamedical
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: STATELESS_HOST
        value: "true"
      - key: STORAGE_CONFIG_FILE
        value: /tmp/clinica-storage.json
      - key: FRONTEND_ORIGINS
        value: https://hashansoysa92-commits.github.io
      - key: ADMIN_NAME
        value: Hashan
      - key: ADMIN_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        value: hashansoysa92@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: DRIVE_CONFIG_FOLDER_ID
        sync: false
