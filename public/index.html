async function ownerCredentialsDialog(owner){modal(`<h2>Super Admin User Name & Password</h2><p>Set your login credentials. Saving signs out old sessions and continues this session with your new credentials.</p><label>User Name<input id="ownerName" autocomplete="username" value="${escapeHtml(owner.name)}"></label><label>New password<input id="ownerPassword" type="password" autocomplete="new-password"></label><button id="saveOwnerCredentials">Save credentials</button>`);button('saveOwnerCredentials',async()=>{const session=await rpc('manageStaffAccount',token,owner.id,$('ownerName').value,$('ownerPassword').value,'SUPERADMIN',true,owner.version);$('ownerPassword').value='';$('dialog').classList.add('hidden');token=session.token;sessionStorage.setItem('visaToken',token);if(boot?.user){boot.user.name=session.user.name;$('identity').textContent=session.user.name+' · SUPERADMIN';}invalidateViews();await showUsers();tell('Super Admin can now sign in using User Name and Password.');});}
async function showCompanies(q='',offset=0){const ticket=++viewGeneration;viewInfo={type:'companies',query:q,offset};if(!viewCache.has(JSON.stringify(['listCompanies',[token,q,offset]])))loadingView('Companies');const r=await cachedView('listCompanies',[token,q,offset]);if(ticket!==viewGeneration)return;$('main').innerHTML=`<div class="card"><h2>Companies</h2><label>Company name<input id="newCompanyName"></label><button id="addCompany">Add Company</button><div class="toolbar"><input id="companySearch" value="${escapeHtml(q)}" placeholder="Search Company"><button id="findCompany">Search</button></div><table><tr><th>Company Name</th></tr>${r.rows.map(c=>`<tr><td>${escapeHtml(c.name)}</td></tr>`).join('')}</table><div class="toolbar"><button id="companyPrev">Previous</button><span>${Math.min(offset+1,r.total)}–${Math.min(offset+100,r.total)} of ${r.total}</span><button id="companyNext">Next</button></div></div>`;button('addCompany',async()=>{await rpc('addCompany',token,$('newCompanyName').value);invalidateViews();await showCompanies(q,offset);tell('Company saved.');});button('findCompany',()=>showCompanies($('companySearch').value));button('companyPrev',()=>showCompanies(q,Math.max(0,offset-100)));button('companyNext',()=>showCompanies(q,offset+100));$('companyPrev').disabled=offset===0;$('companyNext').disabled=offset+100>=r.total;}
async function companyPicker(q='',offset=0){const id=record.id,r=await rpc('listCompanies',token,q,offset);if(record?.id!==id)return;modal(`<h2>Select Company</h2><div class="toolbar"><input id="pickCompanyQuery" value="${escapeHtml(q)}" placeholder="Search Company"><button id="searchCompanyPicker">Search</button></div><label>Company<select id="companyChoice"><option value="">Choose Company</option>${r.rows.map(c=>`<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('')}</select></label><button id="useCompany">Select Company</button><div class="toolbar"><button id="pickCompanyPrev">Previous</button><span>${r.total} companies</span><button id="pickCompanyNext">Next</button></div><label>Add Company<input id="pickNewCompany"></label><button id="addAndUseCompany">Add & Select</button>`);const choose=c=>{if(record?.id!==id)throw Error('Patient changed. Select Company again.');record.meta.company=c.name;record.meta.companyId=c.id;$('metaCompany').value=c.name;markDirty();$('dialog').classList.add('hidden');};button('useCompany',()=>{const c=r.rows.find(c=>c.id===$('companyChoice').value);if(!c)throw Error('Select a Company.');choose(c);});button('addAndUseCompany',async()=>choose(await rpc('addCompany',token,$('pickNewCompany').value)));button('searchCompanyPicker',()=>companyPicker($('pickCompanyQuery').value));button('pickCompanyPrev',()=>companyPicker(q,Math.max(0,offset-100)));button('pickCompanyNext',()=>companyPicker(q,offset+100));$('pickCompanyPrev').disabled=offset===0;$('pickCompanyNext').disabled=offset+100>=r.total;}
async function showRoom(date='',query='',offset=0,background=false){if(date&&date!=='all')date=dateLocal(date);roomFollowToday=!date||date===todayLocal();const ticket=++viewGeneration;viewInfo={type:'room',date,query,offset,updating:false};const args=[token,date||todayLocal(),query,offset],key=JSON.stringify(['roomQueue',args]);if(!background&&!viewCache.has(key))loadingView('Room queue');let r;try{r=await cachedView('roomQueue',args);}catch(error){if(ticket===viewGeneration)loadFailure('Room queue',error,()=>{viewCache.delete(key);return showRoom(date,query,offset);});return;}if(ticket!==viewGeneration)return;viewInfo.date=date==='all'?'all':r.date;liveEpoch=boot?.room?r.epoch:liveEpoch;roomDisplayedEpoch=r.epoch;$('main').innerHTML=`<div class="card"><h2>${boot.user.role==='XRAY'?'X Ray Room':'Sample Room / X Ray Room'} queue</h2><p>Patients appear in arrival order after their name and passport number are saved. Green: all four completed. Red: at least one incomplete.</p><div class="toolbar"><input id="roomDate" placeholder="DD/MM/YYYY" value="${escapeHtml(r.date)}"><input id="roomSearch" placeholder="Name, Company, Passport" value="${escapeHtml(query)}"><button id="roomFind">View</button><button id="roomToday">Today</button><button id="roomAll">All dates</button></div>${r.total?'':`<p>No queue entries match this date / search. ${r.allTotal||0} eligible patients across all dates. Save the patient name and passport number first.</p>`}<div class="scroll"><table><tr><th>Order</th><th>Name</th><th>Company Name</th><th>Passport Number</th><th>Photo</th><th>Xray</th><th>Blood</th><th>Urine</th><th>Status</th></tr>${r.rows.map(row=>`<tr id="roomrow_${row.id}" style="background:${row.complete?'#d8f3df':'#ffe0e0'};color:${row.complete?'#155b2a':'#922626'}"><td>${row.order}</td><td>${escapeHtml(row.name)}</td><td>${escapeHtml(row.company||'—')}</td><td>${escapeHtml(row.passport)}</td>${['photo','xray','blood','urine'].map(f=>`<td><input id="room_${row.id}_${f}" type="checkbox" style="width:auto" ${row[f]?'checked':''} ${r.editable.includes(f)?'':'disabled'} aria-label="${escapeHtml(row.name)} ${f}"></td>`).join('')}<td id="roomstatus_${row.id}">${row.complete?'Completed':'Incomplete'}</td></tr>`).join('')}</table></div><div class="toolbar"><button id="roomPrev">Previous</button><span>${Math.min(offset+1,r.total)}–${Math.min(offset+50,r.total)} of ${r.total}</span><button id="roomNext">Next</button></div></div>`;button('roomFind',()=>showRoom($('roomDate').value||'all',$('roomSearch').value));button('roomToday',()=>showRoom(todayLocal(),query));button('roomAll',()=>showRoom('all',query));button('roomPrev',()=>showRoom(date==='all'?'all':r.date,query,Math.max(0,offset-50)));button('roomNext',()=>showRoom(date==='all'?'all':r.date,query,offset+50));$('roomPrev').disabled=offset===0;$('roomNext').disabled=offset+50>=r.total;for(const row of r.rows)for(const field of r.editable){const e=$('room_'+row.id+'_'+field);e.onchange=guard(async()=>{const value=e.checked,expected=row[field];row[field]=value;row.complete=['photo','xray','blood','urine'].every(f=>row[f]);const tr=$('roomrow_'+row.id),status=$('roomstatus_'+row.id);if(tr){tr.style.background=row.complete?'#d8f3df':'#ffe0e0';tr.style.color=row.complete?'#155b2a':'#922626';}if(status)status.textContent=row.complete?'Completed · saving…':'Incomplete · saving…';e.disabled=true;const info=viewInfo;if(info){info.pendingTicks=(info.pendingTicks||0)+1;info.updating=true;}try{await rpc('updateRoomCheck',token,row.id,field,value,expected);viewCache.set(key,copy(r));if(viewInfo===info&&info.pendingTicks===1){const typed=$('roomSearch')?.value,focused=document.activeElement===$('roomSearch');await showRoom(date==='all'?'all':r.date,query,offset);if(typed!==undefined)$('roomSearch').value=typed;if(focused)$('roomSearch').focus();}}catch(error){row[field]=expected;row.complete=['photo','xray','blood','urine'].every(f=>row[f]);viewCache.set(key,copy(r));e.checked=expected;if(tr){tr.style.background=row.complete?'#d8f3df':'#ffe0e0';tr.style.color=row.complete?'#155b2a':'#922626';}if(status)status.textContent='Save failed · retry';throw error;}finally{e.disabled=false;if(info){info.pendingTicks=Math.max(0,(info.pendingTicks||1)-1);info.updating=info.pendingTicks>0;}}});}}
async function showDriveSettings(){const s=await rpc('driveSettings',token);viewInfo={type:'driveSettings'};modal(`<h2>Google Drive Storage</h2><p>All saved records, signatures, passports and PDFs use this private folder.</p><label>Google Drive folder link<input id="driveFolderLink" value="${escapeHtml(s.folderLink||'')}" placeholder="https://drive.google.com/drive/folders/..."></label><p>${s.connected?'Connected':'Drive authorization required on the server'}</p><button id="saveDriveFolder">Connect folder</button><hr><h3>Import existing records</h3><p>For an empty patient database only. Use the private migration JSON exported from the old system.</p><input id="migrationFile" type="file" accept="application/json,.json"><button id="importMigration">Import records</button>`);button('importMigration',async()=>{const file=$('migrationFile').files[0];if(!file)throw Error('Choose the migration JSON');if(!confirm('Import existing records and accounts into this empty system?'))return;const b=$('importMigration');b.disabled=true;try{await rpc('importMigration',token,await file.text());sessionStorage.removeItem('visaToken');location.reload();}finally{b.disabled=false;}});button('saveDriveFolder',async()=>{const b=$('saveDriveFolder');b.disabled=true;try{await rpc('setDriveFolder',token,$('driveFolderLink').value);tell('Google Drive folder connected.');$('dialog').classList.add('hidden');}finally{b.disabled=false;}});}
async function showRoomLinks(){const ticket=++viewGeneration;viewInfo={type:'roomLinks'};if(!viewCache.has(JSON.stringify(['listRoomLinks',[token]])))loadingView('Room login links');const links=await cachedView('listRoomLinks',[token]);if(ticket!==viewGeneration)return;$('main').innerHTML=`<div class="card"><h2>Room login links</h2><p>Open a link directly in Sample Room or X Ray Room. No password is required. Only Super Admin can create or revoke links.</p><div class="toolbar"><label>Name<input id="roomLinkName" placeholder="Room / device name"></label><label>Room<select id="roomLinkRole"><option value="SAMPLE">Sample Room</option><option value="XRAY">X Ray Room</option></select></label><button id="addRoomLink">Create login link</button></div><table><tr><th>Name</th><th>Room</th><th>Link</th><th></th></tr>${links.map(l=>`<tr><td>${escapeHtml(l.label)}</td><td>${l.role==='XRAY'?'X Ray Room':'Sample Room'}</td><td>${l.active?`<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">Open room</a><input readonly value="${escapeHtml(l.url)}" aria-label="Room login link">`:'Revoked'}</td><td>${l.active?`<button data-revoke-room="${escapeHtml(l.id)}" class="danger">Revoke</button>`:''}</td></tr>`).join('')}</table></div>`;button('addRoomLink',async()=>{await rpc('createRoomLink',token,$('roomLinkRole').value,$('roomLinkName').value);invalidateViews();await showRoomLinks();});$('main').querySelectorAll('[data-revoke-room]').forEach(b=>b.onclick=guard(async()=>{await rpc('revokeRoomLink',token,b.dataset.revokeRoom);invalidateViews();await showRoomLinks();}));}
</script></body></html>
